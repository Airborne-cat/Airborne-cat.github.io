name: Deploy al-folio site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site content
        uses: actions/checkout@v4

      - name: Checkout pinned al-folio starter
        uses: actions/checkout@v4
        with:
          repository: alshedivat/al-folio
          ref: 8ec1f3608d997491e0206c4e7a9368547a5ef255
          path: al-folio

      - name: Apply Airborne-cat content and settings
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf al-folio/_posts al-folio/_projects al-folio/_news
          mkdir -p al-folio/_posts al-folio/_projects al-folio/_news

          if [ -d _posts ]; then cp -a _posts/. al-folio/_posts/; fi
          if [ -d _projects ]; then cp -a _projects/. al-folio/_projects/; fi
          if [ -d _news ]; then cp -a _news/. al-folio/_news/; fi
          if [ -d al-folio-overrides/_pages ]; then cp -a al-folio-overrides/_pages/. al-folio/_pages/; fi
          if [ -d al-folio-overrides/_includes ]; then cp -a al-folio-overrides/_includes/. al-folio/_includes/; fi
          if [ -d al-folio-overrides/_data ]; then cp -a al-folio-overrides/_data/. al-folio/_data/; fi
          if [ -d assets ]; then cp -a assets/. al-folio/assets/; fi

          # Keep Google Search Console verification files in the published site.
          for verification_file in google*.html; do
            [ -f "$verification_file" ] || continue
            cp "$verification_file" al-folio/
          done

          cd al-folio
          ruby <<'RUBY'
          require 'yaml'
          path = '_config.yml'
          config = YAML.unsafe_load_file(path)
          config['title'] = 'Airborne Cat'
          config['first_name'] = 'Airborne'
          config['middle_name'] = ''
          config['last_name'] = 'Cat'
          config['description'] = '인공지능, 머신러닝, 딥러닝, NLP/LLM, CS231n과 수학을 공부하며 수식·코드·실험을 정리하는 Airborne Cat의 기술 블로그입니다.'
          config['keywords'] = 'AI, machine learning, deep learning, LLM, Jekyll, GitHub Pages'
          config['lang'] = 'ko'
          config['timezone'] = 'Asia/Seoul'
          config['visitor_counter'] = true
          config['footer_fixed'] = false
          config['serve_og_meta'] = true
          config['serve_schema_org'] = true
          config['url'] = 'https://airborne-cat.github.io'
          config['baseurl'] = ''
          config['blog_name'] = 'Airborne Cat Blog'
          config['blog_description'] = 'AI · ML · Mathematics · Development'
          config['external_sources'] = []
          config['display_tags'] = ['AI', 'machine-learning', 'deep-learning', 'NLP', 'LLM', 'math']
          config['display_categories'] = ['AI', 'ML', 'NLP', 'Math', 'Projects']
          config['giscus'] ||= {}
          config['giscus']['repo'] = 'Airborne-cat/Airborne-cat.github.io'
          File.write(path, YAML.dump(config))
          RUBY

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: al-folio/package-lock.json

      - name: Build al-folio
        working-directory: al-folio
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3
          npm ci
          export JEKYLL_ENV=production
          bundle exec jekyll build
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Validate search indexing files and remove starter URLs from sitemap
        working-directory: al-folio
        run: |
          python <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          site = Path('_site')
          namespace = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          ET.register_namespace('', namespace['s'])
          sitemap = site / 'sitemap.xml'
          tree = ET.parse(sitemap)
          root = tree.getroot()
          base = 'https://airborne-cat.github.io'
          starter_paths = ('/books/', '/teachings/', '/_pages/dropdown/',
                           '/news/', '/plugins/', '/projects/')
          for entry in list(root):
              loc = entry.find('s:loc', namespace)
              if loc is None or not loc.text:
                  raise ValueError('Sitemap entry is missing its URL')
              url = loc.text
              if not url.startswith(base + '/'):
                  raise ValueError(f'Unexpected sitemap URL: {url}')
              path = url[len(base):]
              if path.startswith(starter_paths) or path.startswith('/google'):
                  root.remove(entry)
          tree.write(sitemap, encoding='utf-8', xml_declaration=True)
          urls = [entry.find('s:loc', namespace).text for entry in root]
          assert base + '/' in urls, 'Homepage is missing from sitemap'
          assert base + '/blog/' in urls, 'Blog index is missing from sitemap'
          assert any('/blog/2026/cs231n-lecture-' in url for url in urls), 'Posts are missing'
          robots = (site / 'robots.txt').read_text()
          assert f'Sitemap: {base}/sitemap.xml' in robots
          for verification in Path('.').glob('google*.html'):
              assert (site / verification.name).read_bytes() == verification.read_bytes()
          for page in [site / 'index.html', site / 'blog/index.html']:
              html = page.read_text()
              assert 'busuanzi_today_uv' in html and 'busuanzi_site_uv' in html, f'Visitor widget missing: {page}'
              assert 'https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js' in html
              assert 'application/ld+json' in html, f'Structured data missing: {page}'
              assert 'name="robots" content="noindex' not in html
          assert (site / 'assets/js/visitor-counter.js').is_file()
          assert (site / 'assets/css/visitor-counter.css').is_file()
          print(f'Validated sitemap ({len(urls)} URLs), robots.txt and Google verification files')
          PY

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: al-folio/_site
          clean: true

